<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Tyler's Tandem</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--red:#b51e00;--dark:#7a1400;--cream:#f5f0e8;--cream2:#ece6da;--border:#ddd6c8}
body{font-family:"DM Sans",sans-serif;background:var(--cream);min-height:100vh}

#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:2rem}
.login-card{background:#fff;border:1px solid var(--border);border-radius:20px;padding:2.5rem;width:100%;max-width:380px;text-align:center}
.login-card img{height:24px;margin-bottom:1.25rem}
.login-card h1{font-family:Syne,sans-serif;font-size:1.5rem;font-weight:800;margin-bottom:0.5rem}
.login-card p{font-size:13px;color:#999;margin-bottom:1.5rem}
.login-card input{width:100%;border:1px solid var(--border);border-radius:10px;padding:10px 14px;font-size:14px;font-family:"DM Sans",sans-serif;outline:none;margin-bottom:1rem;background:var(--cream)}
.login-card input:focus{border-color:var(--red)}
.err{color:var(--red);font-size:13px;margin-top:0.5rem}

#admin-screen{display:none;max-width:760px;margin:0 auto;padding:2rem 1.5rem}

.top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem;padding-bottom:1rem;border-bottom:1px solid var(--border)}
.top-bar h1{font-family:Syne,sans-serif;font-size:1.3rem;font-weight:800}
.top-links{display:flex;gap:12px;align-items:center}
.top-links a{font-size:13px;color:var(--red);text-decoration:none;font-weight:500}

.quick-links{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:2rem}
.ql{background:#fff;border:1px solid var(--border);border-radius:12px;padding:0.9rem 1rem;text-decoration:none;display:flex;flex-direction:column;gap:4px}
.ql:hover{border-color:var(--red)}
.ql-label{font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#bbb}
.ql-value{font-size:13px;font-weight:500;color:#111;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:1.5rem;margin-bottom:1.25rem}
.card-title{font-family:Syne,sans-serif;font-size:1rem;font-weight:800;margin-bottom:1.25rem;color:#111;display:flex;align-items:center;justify-content:space-between}
.card-title a{font-size:12px;color:var(--red);font-weight:500;text-decoration:none}

.field{margin-bottom:1rem}
.field label{display:block;font-size:12px;font-weight:500;color:#888;margin-bottom:5px;text-transform:uppercase;letter-spacing:0.06em}
.field input,.field textarea{width:100%;border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-size:13px;font-family:"DM Sans",sans-serif;outline:none;background:var(--cream);resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--red);background:#fff}
.field textarea{min-height:80px}
.hint{font-size:11px;color:#bbb;margin-top:4px;line-height:1.4}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.preview-img{width:60px;height:60px;border-radius:8px;object-fit:cover;border:1px solid var(--border);margin-top:6px;display:none}

.btn{background:var(--red);color:#fff;border:none;border-radius:8px;padding:9px 20px;font-size:13px;font-weight:500;cursor:pointer;font-family:"DM Sans",sans-serif}
.btn:hover{background:var(--dark)}
.btn-row{display:flex;align-items:center;gap:10px;margin-top:0.5rem}
.saved{font-size:12px;color:#2a7a3a;opacity:0;transition:opacity 0.3s}

.video-list{display:flex;flex-direction:column;gap:8px;margin-bottom:1rem}
.video-row{display:flex;align-items:center;gap:10px;background:var(--cream);border-radius:10px;padding:8px 12px}
.video-thumb{width:44px;height:44px;object-fit:cover;border-radius:6px;flex-shrink:0;background:var(--cream2)}
.video-url{flex:1;font-size:13px;color:#555;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.video-del{background:none;border:none;color:#ddd;cursor:pointer;font-size:18px;flex-shrink:0;padding:0 4px}
.video-del:hover{color:var(--red)}
.no-videos{font-size:13px;color:#ccc;padding:0.5rem 0}
.add-row{display:flex;flex-direction:column;gap:8px}
.add-row input{width:100%;border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:13px;font-family:"DM Sans",sans-serif;outline:none;background:var(--cream)}
.add-row input:focus{border-color:var(--red);background:#fff}
.add-row-inner{display:flex;gap:8px}
.status{font-size:12px;padding:0.5rem 0.9rem;border-radius:8px;margin-top:0.5rem;display:none}
.status.ok{background:#edfaf1;color:#1a7a3a;display:block}
.status.err{background:#fef0f0;color:var(--red);display:block}

@media(max-width:500px){.quick-links{grid-template-columns:1fr 1fr}.field-row{grid-template-columns:1fr}}
</style>
</head>

    <h1>Tyler's Tandem</h1>
    <p>Admin panel</p>
    <input type="password" id="pw" placeholder="Password" onkeydown="if(event.key==='Enter')login()">
    <button class="btn" style="width:100%" onclick="login()">Sign in</button>
    <div class="err" id="pw-err"></div>
  </div>
</div>

<div id="admin-screen">
  <div class="top-bar">
    <h1>Tyler's Tandem — Admin</h1>
    <div class="top-links">
      <a href="/" target="_blank">View site →</a>
      <a href="https://docs.google.com/spreadsheets/d/1mNtn9OB2dWK39WqVUZXcN94Y4Rwo3NBxhq7x_vN6E38/edit" target="_blank">Open Sheet →</a>
      <a href="https://app.tiltify.com" target="_blank">Tiltify →</a>
      <a href="https://instagram.com/tylermitic" target="_blank">Instagram →</a>
    </div>
  </div>

  <div class="quick-links" id="quick-links">
    <div class="ql"><span class="ql-label">Raised</span><span class="ql-value" id="ql-raised">Loading...</span></div>
    <div class="ql"><span class="ql-label">Donations</span><span class="ql-value" id="ql-donations">Loading...</span></div>
    <div class="ql"><span class="ql-label">Campaign</span><span class="ql-value" id="ql-campaign">Loading...</span></div>
  </div>

  <div class="card">
    <div class="card-title">Tiltify credentials <a href="https://app.tiltify.com/dashboard/applications" target="_blank">Get token →</a></div>
    <div class="field-row">
      <div class="field">
        <label>Campaign ID</label>
        <input type="text" id="f-campaign-id" placeholder="653378fc-...">
      </div>
      <div class="field">
        <label>Access token</label>
        <input type="text" id="f-token" placeholder="5f7aefb9...">
      </div>
    </div>
    <div class="btn-row"><button class="btn" onclick="saveSettings('creds')">Save</button><span class="saved" id="saved-creds">✓ Saved</span></div>
  </div>

  <div class="card">
    <div class="card-title">Photos <span style="font-size:11px;color:#bbb;font-weight:400">Use imgur.com to get direct image URLs</span></div>
    <div class="field">
      <label>Your profile photo (circle at top)</label>
      <input type="text" id="f-hero-photo" placeholder="https://i.imgur.com/..." oninput="previewImg(this,'prev-hero')">
      <img id="prev-hero" class="preview-img">
    </div>
    <div class="field">
      <label>Main ride photo (banner)</label>
      <input type="text" id="f-ride-photo" placeholder="https://i.imgur.com/..." oninput="previewImg(this,'prev-ride')">
      <img id="prev-ride" class="preview-img">
    </div>
    <div class="field-row">
      <div class="field">
        <label>$100 incentive photo</label>
        <input type="text" id="f-inc-0" placeholder="https://i.imgur.com/..." oninput="previewImg(this,'prev-inc0')">
        <img id="prev-inc0" class="preview-img">
      </div>
      <div class="field">
        <label>$1,000 incentive photo</label>
        <input type="text" id="f-inc-1" placeholder="https://i.imgur.com/..." oninput="previewImg(this,'prev-inc1')">
        <img id="prev-inc1" class="preview-img">
      </div>
    </div>
    <div class="field">
      <label>$5,000 incentive photo</label>
      <input type="text" id="f-inc-2" placeholder="https://i.imgur.com/..." oninput="previewImg(this,'prev-inc2')">
      <img id="prev-inc2" class="preview-img">
    </div>
    <div class="btn-row"><button class="btn" onclick="saveSettings('photos')">Save photos</button><span class="saved" id="saved-photos">✓ Saved</span></div>
  </div>

  <div class="card">
    <div class="card-title">Site text</div>
    <div class="field">
      <label>Logline (under your name)</label>
      <input type="text" id="f-logline">
    </div>
    <div class="btn-row"><button class="btn" onclick="saveSettings('text')">Save text</button><span class="saved" id="saved-text">✓ Saved</span></div>
  </div>

  <div class="card">
    <div class="card-title">Daily videos</div>
    <div class="video-list" id="video-list"><div class="no-videos">No videos yet</div></div>
    <div class="add-row">
      <input type="text" id="new-video-url" placeholder="Instagram URL — https://www.instagram.com/reel/...">
      <div class="add-row-inner">
        <input type="text" id="new-video-thumb" placeholder="Thumbnail URL — https://i.imgur.com/...">
        <button class="btn" onclick="addVideo()">Add</button>
      </div>
    </div>
    <div id="video-status" class="status"></div>
  </div>
</div>

<script>
const SHEET_ID = "1mNtn9OB2dWK39WqVUZXcN94Y4Rwo3NBxhq7x_vN6E38";
const GAS_URL = "https://script.google.com/macros/s/AKfycbxlvyZ3AJhQH2RiuY_WIAuX0Ww-CQ5pH2pjSywtCOpdFYiK7bORP0_wGGdWgEEIXmhp/exec";
const TILTIFY_BASE = "https://v5api.tiltify.com";
const ADMIN_PASSWORD = "yourmother";
let campaignId = "", tiltifyToken = "";

function login(){
  if(document.getElementById("pw").value === ADMIN_PASSWORD){
    document.getElementById("login-screen").style.display="none";
    document.getElementById("admin-screen").style.display="block";
    loadAll();
  } else {
    document.getElementById("pw-err").textContent="Wrong password.";
  }
}

function previewImg(input, previewId){
  const img = document.getElementById(previewId);
  if(input.value.trim()){
    img.src = input.value.trim();
    img.style.display = "block";
    img.onerror = function(){ this.style.display="none"; };
  } else {
    img.style.display = "none";
  }
}

async function sheetFetch(tab){
  const url="https://docs.google.com/spreadsheets/d/"+SHEET_ID+"/gviz/tq?tqx=out:json&sheet="+encodeURIComponent(tab);
  const r=await fetch(url);
  const txt=await r.text();
  const json=JSON.parse(txt.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/)[1]);
  return json.table;
}

async function gasPost(data){
  await fetch(GAS_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});
}

async function loadAll(){
  try{
    const t = await sheetFetch("Settings");
    const data = {};
    (t.rows||[]).forEach(r=>{ const k=r.c[0]?.v; const v=r.c[1]?.v||""; if(k&&k!=="Key") data[k]=v; });
    document.getElementById("f-campaign-id").value = data.tiltify_campaign_id||"";
    document.getElementById("f-token").value = data.tiltify_token||"";
    document.getElementById("f-hero-photo").value = data.hero_photo||"";
    document.getElementById("f-ride-photo").value = data.ride_photo||"";
    document.getElementById("f-inc-0").value = data.inc_photo_0||"";
    document.getElementById("f-inc-1").value = data.inc_photo_1||"";
    document.getElementById("f-inc-2").value = data.inc_photo_2||"";
    document.getElementById("f-logline").value = data.logline||"";
    campaignId = data.tiltify_campaign_id||"";
    tiltifyToken = data.tiltify_token||"";
    ["hero","ride","inc0","inc1","inc2"].forEach(k=>{
      const fieldMap={hero:"f-hero-photo",ride:"f-ride-photo",inc0:"f-inc-0",inc1:"f-inc-1",inc2:"f-inc-2"};
      const prevMap={hero:"prev-hero",ride:"prev-ride",inc0:"prev-inc0",inc1:"prev-inc1",inc2:"prev-inc2"};
      const val=document.getElementById(fieldMap[k]).value;
      if(val){ const img=document.getElementById(prevMap[k]); img.src=val; img.style.display="block"; img.onerror=function(){this.style.display="none";}; }
    });
    if(campaignId && tiltifyToken) loadTiltifyStats();
  }catch(e){console.error("Load settings error",e);}

  try{
    const t = await sheetFetch("Videos");
    const videos=(t.rows||[]).filter(r=>r.c[0]?.v&&r.c[0].v!=="url").map(r=>({url:r.c[0].v,thumb:r.c[1]?.v||""})).reverse();
    renderVideos(videos);
  }catch(e){console.error("Load videos error",e);}
}

async function loadTiltifyStats(){
  try{
    const r=await fetch(TILTIFY_BASE+"/api/public/campaigns/"+campaignId,{headers:{Authorization:"Bearer "+tiltifyToken}});
    const c=(await r.json()).data;
    const raised=c.amount_raised?.value?("$"+parseFloat(c.amount_raised.value).toLocaleString("en-US",{minimumFractionDigits:2})):"$0";
    document.getElementById("ql-raised").textContent=raised;
    document.getElementById("ql-campaign").textContent=c.name||"Active";
    const dr=await fetch(TILTIFY_BASE+"/api/public/campaigns/"+campaignId+"/donations",{headers:{Authorization:"Bearer "+tiltifyToken}});
    const donations=(await dr.json()).data||[];
    document.getElementById("ql-donations").textContent=donations.length+" donations";
  }catch(e){
    document.getElementById("ql-raised").textContent="Check token";
    document.getElementById("ql-donations").textContent="—";
    document.getElementById("ql-campaign").textContent="—";
  }
}

function renderVideos(videos){
  const list=document.getElementById("video-list");
  if(!videos.length){list.innerHTML='<div class="no-videos">No videos yet</div>';list._videos=[];return;}
  list.innerHTML=videos.map((v,i)=>{
    const thumb=v.thumb?'<img src="'+v.thumb+'" class="video-thumb" onerror="this.style.background='#ece6da'">':'<div class="video-thumb"></div>';
    return '<div class="video-row">'+thumb+'<span class="video-url">'+v.url+'</span><button class="video-del" onclick="removeVideo('+i+')" title="Remove">×</button></div>';
  }).join("");
  list._videos=videos;
}

async function saveSettings(section){
  const updates={action:"saveSettings"};
  if(section==="creds"||section==="all"){
    updates.tiltify_campaign_id=document.getElementById("f-campaign-id").value.trim();
    updates.tiltify_token=document.getElementById("f-token").value.trim();
  }
  if(section==="photos"||section==="all"){
    updates.hero_photo=document.getElementById("f-hero-photo").value.trim();
    updates.ride_photo=document.getElementById("f-ride-photo").value.trim();
    updates.inc_photo_0=document.getElementById("f-inc-0").value.trim();
    updates.inc_photo_1=document.getElementById("f-inc-1").value.trim();
    updates.inc_photo_2=document.getElementById("f-inc-2").value.trim();
  }
  if(section==="text"||section==="all"){
    updates.logline=document.getElementById("f-logline").value.trim();
  }
  await gasPost(updates);
  const el=document.getElementById("saved-"+section);
  if(el){el.style.opacity="1";setTimeout(()=>el.style.opacity="0",2500);}
}

async function addVideo(){
  const urlInput=document.getElementById("new-video-url");
  const thumbInput=document.getElementById("new-video-thumb");
  const url=urlInput.value.trim();
  const thumb=thumbInput.value.trim();
  if(!url){return;}
  if(!url.includes("instagram.com")){showStatus("Paste a valid Instagram URL","err");return;}
  await gasPost({action:"addVideo",url,thumb});
  urlInput.value="";thumbInput.value="";
  showStatus("Video added! Refresh site in ~30 seconds to see it.","ok");
  setTimeout(loadAll,3000);
}

async function removeVideo(idx){
  const videos=document.getElementById("video-list")._videos||[];
  const v=videos[idx];
  if(!v)return;
  await gasPost({action:"removeVideo",url:v.url});
  showStatus("Removed.","ok");
  setTimeout(loadAll,2000);
}

function showStatus(msg,type){
  const el=document.getElementById("video-status");
  el.textContent=msg;
  el.className="status "+type;
  setTimeout(()=>{el.className="status";},4000);
}
</script>
</body>
